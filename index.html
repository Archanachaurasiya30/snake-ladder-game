<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake & Ladder Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 Snake & Ladder Game 🪜</h1>
        
        <div class="game-info">
            <div class="player-info">
                <h2>Player 1 (Red)</h2>
                <p id="player1-position">Position: 1</p>
                <div class="player1-indicator"></div>
            </div>
            <div class="player-info">
                <h2>Player 2 (Blue)</h2>
                <p id="player2-position">Position: 1</p>
                <div class="player2-indicator"></div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button id="rollButton" class="btn btn-roll">🎲 Roll Dice</button>
            <p id="diceResult">Roll the dice to start!</p>
            <button id="resetButton" class="btn btn-reset">🔄 Reset Game</button>
        </div>

        <div class="info-box">
            <h3>Game Rules:</h3>
            <ul>
                <li>Roll the dice to move forward</li>
                <li>Reach position 100 to win</li>
                <li>If you land on a snake's head, slide down</li>
                <li>If you land on a ladder, climb up</li>
                <li>Players alternate turns</li>
            </ul>
        </div>

        <div id="winnerModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winnerText"></h2>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
